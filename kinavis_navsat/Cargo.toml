[package]
name = "kinavis_navsat"
description = "ROS 2 node for an NMEA 0183 GNSS receiver: NavSatFix, velocity and time reference from the KINAVIS crates."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KINAVIS/ros2-kinavis"
publish = false

[[bin]]
name = "nmea_navsat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
kinavis_navsat_core = { path = "../kinavis_navsat_core" }
kinavis-nmea0183 = "0.2"
rclrs = "0.8"
# Message types generated in the sourced ROS 2 workspace.
ros-env = "0.3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
