[package]
name = "kinavis_navsat_core"
description = "NMEA 0183 receiver output to the NavSatFix, velocity and time reference of a ROS 2 node, without ROS."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KINAVIS/ros2-kinavis"
publish = false

[dependencies]
kinavis-kernel = "1.1"
kinavis-nmea0183 = "0.2"
kinavis-ros2 = "0.1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
